server:
  port: 8080

identity-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
marketplace-url: ${MARKETPLACE_SERVICE_URL:http://localhost:8082}
contract-url: ${CONTRACT_SERVICE_URL:http://localhost:8083}
communication-url: ${COMMUNICATION_SERVICE_URL:http://localhost:8084}
catalog-url: ${CATALOG_SERVICE_URL:http://localhost:8085}
proposal-url: ${PROPOSAL_SERVICE_URL:http://localhost:8086}
project-url: ${PROJECT_SERVICE_URL:http://localhost:8087}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: identity-service
              uri: ${identity-url}
              predicates:
                - Path=/api/auth/**,/api/users/**,/api/freelancers/**,/api/admin/freelancer-applications/**
            - id: catalog-service
              uri: ${catalog-url}
              predicates:
                - Path=/api/skills/**,/api/categories/**
            - id: proposal-service
              uri: ${proposal-url}
              predicates:
                - Path=/api/proposals/**,/api/projects/*/proposals,/api/admin/proposals/**
            - id: project-service
              uri: ${project-url}
              predicates:
                - Path=/api/projects/**
            - id: marketplace-service
              uri: ${marketplace-url}
              predicates:
                - Path=/api/bookmarks/**
            - id: contract-service
              uri: ${contract-url}
              predicates:
                - Path=/api/admin/contracts/**,/api/contracts/**,/api/milestones/**,/api/wallets/**,/api/reviews/**,/api/simulations/**
            - id: communication-service
              uri: ${communication-url}
              predicates:
                - Path=/api/notifications/**,/api/conversations/**
