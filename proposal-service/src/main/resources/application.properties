spring.application.name=proposal-service
server.port=8086
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.mongodb.uri=${MONGO_URI}
spring.mongodb.database=proposal_db
spring.data.mongodb.auto-index-creation=true

jwt.secret=${JWT_SECRET}

project.service.url=${PROJECT_SERVICE_URL:http://localhost:8087}
contract.service.url=${CONTRACT_SERVICE_URL:http://localhost:8083}

server.error.include-stacktrace=never
server.error.include-exception=false
identity.service.url=${IDENTITY_SERVICE_URL:http://localhost:8081}
